# tools/check.sh (gofmt, go vet, the tests and PROVENANCE.md's rows) on Linux and macOS, for every
# push to main and every pull request, as tools/live.sh runs it before an install, and Irie for
# Windows and its wrapper on Windows. The Mac app (mac/) is not built here; mac/build.sh takes about ten
# minutes and needs Xcode.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Irie runs every agent in tmux, and its tests start private tmux servers.
      - name: tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -q && sudo apt-get install -y -q tmux
            else
              brew install tmux
            fi
          fi
          tmux -V
      # The runner tools/check.sh runs the tests through (tools/test.sh), in
      # Rust: its own checks first.
      - name: testrunner
        working-directory: tools/testrunner
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: sh tools/check.sh
  # Irie for Windows (cmd/windows-app) and the wrapper (cmd/windows, docs/WINDOWS.md) on Windows
  # itself: their checks, then site/install.ps1 from a local mirror of the downloads, irie.exe's
  # own look at the machine, and the app's window drawn into PNGs against a stand-in for Irie in
  # Linux (tools/winpreview -bridge), which the run keeps. GitHub's Windows has no WSL 2 to run
  # Irie in, so the look says what is missing and changes nothing.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: wrapper and app
        shell: bash
        run: |
          go vet ./cmd/windows ./cmd/windows-app ./internal/wsl ./internal/mux ./internal/winapp/fixture ./internal/winapp/web ./tools/winpreview
          go test ./internal/wsl ./internal/mux
      - name: install.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path "$dist\x\bin" | Out-Null
          go build -trimpath -o "$dist\x\bin\irie.exe" ./cmd/windows
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          go build -trimpath -ldflags "-H windowsgui" -o "$dist\x\Irie.exe" ./cmd/windows-app
          if ($LASTEXITCODE -ne 0) { throw 'go build of the app failed' }
          Copy-Item cmd/windows-app/Irie.ico "$dist\x\Irie.ico"
          Copy-Item internal/winapp/web/vendor/NOTICES.txt "$dist\x\THIRD-PARTY-NOTICES.txt"
          Copy-Item LICENSE "$dist\x\LICENSE"
          Compress-Archive -Path "$dist\x\Irie.exe", "$dist\x\Irie.ico", "$dist\x\bin", "$dist\x\LICENSE", "$dist\x\THIRD-PARTY-NOTICES.txt" -DestinationPath "$dist\irie-windows-amd64.zip"
          $h = (Get-FileHash -Algorithm SHA256 "$dist\irie-windows-amd64.zip").Hash.ToLower()
          Set-Content -Path "$dist\SHA256SUMS" -Value "$h  irie-windows-amd64.zip" -Encoding ascii
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $dist -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 50; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/SHA256SUMS | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          $env:IRIE_DOWNLOADS = 'http://127.0.0.1:8765'
          $env:IRIE_NO_SETUP = '1'
          # Twice: an install, then an update over it.
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'irie\bin\irie.exe'
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "irie.exe version exited $LASTEXITCODE" }
          $app = Join-Path $env:LOCALAPPDATA 'irie\Irie.exe'
          if (-not (Test-Path $app)) { throw 'install.ps1 did not install Irie.exe' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Irie.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $app) { throw "the Start menu's Irie opens $target, not $app" }
          $look = & $exe setup --check | Out-String
          $code = $LASTEXITCODE
          Write-Host $look
          if ($code -gt 1 -or $look -notmatch 'Windows build \d+') { throw "irie.exe setup --check exited $code" }
          # A wrong checksum installs nothing.
          Set-Content -Path "$dist\SHA256SUMS" -Value "$('0' * 64)  irie-windows-amd64.zip" -Encoding ascii
          $failed = $false
          try { Get-Content site/install.ps1 -Raw | Invoke-Expression } catch { $failed = $_.Exception.Message -match 'SHA-256' }
          if (-not $failed) { throw 'install.ps1 took a download whose checksum was wrong' }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          # The runner ends the step with the last program's exit code, which
          # is setup --check's 1 on a Windows without WSL 2.
          exit 0
      - name: the app's window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = $env:RUNNER_TEMP
          go build -o "$t\winpreview.exe" ./tools/winpreview
          if ($LASTEXITCODE -ne 0) { throw 'go build of winpreview failed' }
          # A console build, so a panic as it starts shows here; the release's is -H windowsgui.
          go build -o "$t\Irie.exe" ./cmd/windows-app
          if ($LASTEXITCODE -ne 0) { throw 'go build of the app failed' }
          $env:IRIE_APP_BRIDGE = "`"$t\winpreview.exe`" -bridge"
          $shots = Join-Path $t 'shots'
          & "$t\Irie.exe" --snapshot $shots
          $code = $LASTEXITCODE
          $log = Join-Path $env:LOCALAPPDATA 'irie\app.log'
          if (Test-Path $log) { Get-Content $log }
          if ($code -ne 0) { throw "Irie.exe --snapshot exited $code" }
          foreach ($f in 'window.png', 'settings.png', 'menu.png') {
            $png = Join-Path $shots $f
            if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 20000) { throw "$f is missing or blank" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irie-for-windows-snapshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
