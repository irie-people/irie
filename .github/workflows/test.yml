# tools/check.sh (gofmt, PROVENANCE.md's rows, the docs' paths, go vet, the tests and their coverage
# floors, DESIGN §2.12) on Linux and macOS, for every
# push to main and every pull request, as tools/live.sh runs it before an install, again on Linux
# with the checkout renamed to a company's copy, and Irie for
# Windows and its wrapper on Windows. The Mac app (mac/) is not built here; mac/build.sh takes about ten
# minutes and needs Xcode.
name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      # Irie runs every agent in tmux, and its tests start private tmux servers.
      - name: tmux
        run: |
          if ! command -v tmux >/dev/null; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -q && sudo apt-get install -y -q tmux
            else
              brew install tmux
            fi
          fi
          tmux -V
      # The runner tools/check.sh runs the tests through (tools/test.sh), in
      # Rust: its own checks first.
      - name: testrunner
        working-directory: tools/testrunner
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: sh tools/check.sh
  # A company's copy under its own name (DESIGN §2.10, docs/proposals/company-copies.md R16): the
  # checkout renamed to Pesto, a copy for testing, by tools/rebrand.sh, then the same checks. A test
  # or a text that holds only under Irie's own names fails here rather than in a company's copy.
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: tmux
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tmux
          tmux -V
      - run: sh tools/rebrand.sh --tagline "Fresh basil for your agents." Pesto
      - run: sh tools/check.sh
  # Irie for Windows (cmd/windows-app) and the wrapper (cmd/windows, docs/WINDOWS.md) on Windows
  # itself: their checks, then site/install.ps1 from a local mirror of the downloads, irie.exe's
  # own look at the machine, and the app's window drawn into PNGs against a stand-in for Irie in
  # Linux (tools/winpreview -bridge), which the run keeps. Its windows-latest has no WSL 2 to run
  # Irie in, so the look says what is missing and changes nothing; windows-wsl runs it in WSL 2.
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: wrapper and app
        shell: bash
        run: |
          go vet ./cmd/windows ./cmd/windows-app ./internal/wsl ./internal/mux ./internal/winapp/fixture ./internal/winapp/web ./tools/winpreview
          go test ./internal/wsl ./internal/mux
      - name: install.ps1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force -Path "$dist\x\bin" | Out-Null
          go build -trimpath -o "$dist\x\bin\irie.exe" ./cmd/windows
          if ($LASTEXITCODE -ne 0) { throw 'go build failed' }
          go build -trimpath -ldflags "-H windowsgui" -o "$dist\x\Irie.exe" ./cmd/windows-app
          if ($LASTEXITCODE -ne 0) { throw 'go build of the app failed' }
          Copy-Item cmd/windows-app/Irie.ico "$dist\x\Irie.ico"
          Copy-Item internal/winapp/web/vendor/NOTICES.txt "$dist\x\THIRD-PARTY-NOTICES.txt"
          Copy-Item LICENSE "$dist\x\LICENSE"
          Compress-Archive -Path "$dist\x\Irie.exe", "$dist\x\Irie.ico", "$dist\x\bin", "$dist\x\LICENSE", "$dist\x\THIRD-PARTY-NOTICES.txt" -DestinationPath "$dist\irie-windows-amd64.zip"
          $h = (Get-FileHash -Algorithm SHA256 "$dist\irie-windows-amd64.zip").Hash.ToLower()
          Set-Content -Path "$dist\SHA256SUMS" -Value "$h  irie-windows-amd64.zip" -Encoding ascii
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $dist -PassThru -WindowStyle Hidden
          for ($i = 0; $i -lt 50; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/SHA256SUMS | Out-Null; break } catch { Start-Sleep -Milliseconds 200 }
          }
          $env:IRIE_DOWNLOADS = 'http://127.0.0.1:8765'
          $env:IRIE_NO_SETUP = '1'
          # Twice: an install, then an update over it.
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          Get-Content site/install.ps1 -Raw | Invoke-Expression
          $exe = Join-Path $env:LOCALAPPDATA 'irie\bin\irie.exe'
          & $exe version
          if ($LASTEXITCODE -ne 0) { throw "irie.exe version exited $LASTEXITCODE" }
          $app = Join-Path $env:LOCALAPPDATA 'irie\Irie.exe'
          if (-not (Test-Path $app)) { throw 'install.ps1 did not install Irie.exe' }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Irie.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne $app) { throw "the Start menu's Irie opens $target, not $app" }
          $look = & $exe setup --check | Out-String
          $code = $LASTEXITCODE
          Write-Host $look
          if ($code -gt 1 -or $look -notmatch 'Windows build \d+') { throw "irie.exe setup --check exited $code" }
          # A wrong checksum installs nothing.
          Set-Content -Path "$dist\SHA256SUMS" -Value "$('0' * 64)  irie-windows-amd64.zip" -Encoding ascii
          $failed = $false
          try { Get-Content site/install.ps1 -Raw | Invoke-Expression } catch { $failed = $_.Exception.Message -match 'SHA-256' }
          if (-not $failed) { throw 'install.ps1 took a download whose checksum was wrong' }
          Stop-Process -Id $server.Id -ErrorAction SilentlyContinue
          # The runner ends the step with the last program's exit code, which
          # is setup --check's 1 on a Windows without WSL 2.
          exit 0
      - name: the app's window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $t = $env:RUNNER_TEMP
          go build -o "$t\winpreview.exe" ./tools/winpreview
          if ($LASTEXITCODE -ne 0) { throw 'go build of winpreview failed' }
          # A console build, so a panic as it starts shows here; the release's is -H windowsgui.
          go build -o "$t\Irie.exe" ./cmd/windows-app
          if ($LASTEXITCODE -ne 0) { throw 'go build of the app failed' }
          $env:IRIE_APP_BRIDGE = "`"$t\winpreview.exe`" -bridge"
          $shots = Join-Path $t 'shots'
          & "$t\Irie.exe" --snapshot $shots
          $code = $LASTEXITCODE
          $log = Join-Path $env:LOCALAPPDATA 'irie\app.log'
          if (Test-Path $log) { Get-Content $log }
          if ($code -ne 0) { throw "Irie.exe --snapshot exited $code" }
          foreach ($f in 'window.png', 'settings.png', 'menu.png') {
            $png = Join-Path $shots $f
            if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 20000) { throw "$f is missing or blank" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irie-for-windows-snapshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
  # Irie for Windows on a real WSL 2, as on a person's computer: Ubuntu from wsl --install with a
  # user of its own, Irie put in it by site/install.sh from this checkout's build, then
  # Irie.exe --snapshot with nothing standing in, from a cold start of Linux. It must start the
  # core through irie bridge and draw the window. windows-2025's runners run WSL 2. The run keeps
  # the pictures; the steps print app.log and the core's log, and post what they found as notices,
  # which the checks API serves when a run's logs can't be downloaded.
  windows-wsl:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      WSL_UTF8: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Ubuntu in WSL 2, with a user of its own
        run: |
          # Linux runs a script in Ubuntu, sent as base64 so that no quoting goes through wsl.exe,
          # and gives what it wrote; Note posts text as the run's notice.
          @'
          function Linux([string]$script, [string]$user = '') {
            $b = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($script -replace "`r", '')))
            $as = @(); if ($user) { $as = '-u', $user }
            wsl.exe -d Ubuntu @as --cd ~ -e sh -c "echo $b | base64 -d | sh -l 2>&1"
          }
          function Note([string]$title, [string]$text) {
            if ($text.Length -gt 6000) { $text = '…' + $text.Substring($text.Length - 6000) }
            $t = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            Write-Output "::notice title=$($title.Replace(':', ' ').Replace(',', ' '))::$t"
          }
          '@ | Set-Content "$env:RUNNER_TEMP\linux.ps1"
          . "$env:RUNNER_TEMP\linux.ps1"
          wsl.exe --version
          wsl.exe --install -d Ubuntu --no-launch --web-download
          if ($LASTEXITCODE -ne 0) { throw "wsl --install exited $LASTEXITCODE" }
          # As Ubuntu's first start makes one: uid 1000 with sudo, here with no password to type.
          $out = Linux -user root @'
          set -eu
          name=$(getent passwd 1000 | cut -d: -f1)
          if [ -z "$name" ]; then name=alice; useradd -m -s /bin/bash -u 1000 -G sudo "$name"; fi
          echo "$name ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/90-"$name"
          printf '\n[user]\ndefault=%s\n' "$name" >> /etc/wsl.conf
          head -2 /etc/os-release
          if command -v tmux >/dev/null; then tmux -V; else echo 'no tmux'; fi
          for c in curl wget git; do command -v $c >/dev/null || echo "no $c"; done
          '@ | Out-String
          $code = $LASTEXITCODE
          $out
          if ($code -ne 0) { Note 'Ubuntu user' $out; throw "making Ubuntu's user failed" }
          wsl.exe --terminate Ubuntu
          wsl.exe -l -v
          $out += Linux 'id; echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}"; ls -ld "${XDG_RUNTIME_DIR:-/nonexistent}"; echo "pid 1: $(ps -p 1 -o comm=)"; loginctl list-sessions --no-pager 2>&1 | head -5' | Out-String
          $out
          Note 'Ubuntu' $out
      - name: Irie in Ubuntu, from site/install.sh and this checkout's build
        run: |
          . "$env:RUNNER_TEMP\linux.ps1"
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory -Force $dist | Out-Null
          $env:CGO_ENABLED = '0'; $env:GOOS = 'linux'; $env:GOARCH = 'amd64'
          $out = go build -trimpath -o "$dist\irie" ./cmd/irie 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { $out; Note 'go build' $out; throw 'go build of irie for Linux failed' }
          Remove-Item Env:GOOS, Env:GOARCH
          Copy-Item LICENSE "$dist\LICENSE"
          $d = (wsl.exe -d Ubuntu -e wslpath -a $dist | Out-String).Trim()
          $sh = (wsl.exe -d Ubuntu -e wslpath -a (Resolve-Path site\install.sh).Path | Out-String).Trim()
          "dist: $d; install.sh: $sh"
          # The tarball is made in Linux, where irie keeps its executable bit, as tools/release.sh makes it.
          $script = @'
          set -e
          t=$(mktemp -d); cp 'DIST/irie' 'DIST/LICENSE' "$t"; chmod +x "$t/irie"
          tar -czf 'DIST/irie-linux-amd64.tar.gz' -C "$t" irie LICENSE
          cd 'DIST' && sha256sum irie-linux-amd64.tar.gz > SHA256SUMS && cd
          # Git on Windows checks site/install.sh out with CRLFs; the site serves it with LFs.
          tr -d '\r' < 'SITE' > "$t/install.sh"
          IRIE_DOWNLOADS='file://DIST' IRIE_NO_SETUP=1 sh "$t/install.sh" </dev/null
          ~/.local/bin/irie version </dev/null
          ~/.local/bin/irie setup --check </dev/null || true
          '@
          $out = Linux $script.Replace('DIST', $d).Replace('SITE', $sh) | Out-String
          $code = $LASTEXITCODE
          $out
          Note "install.sh exited $code (dist $d)" $out
          if ($code -ne 0) { throw 'install.sh failed' }
      - name: Irie.exe, from a cold start of Linux
        run: |
          . "$env:RUNNER_TEMP\linux.ps1"
          # A console build, so a panic as it starts shows here.
          $out = go build -o "$env:RUNNER_TEMP\Irie.exe" ./cmd/windows-app 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { $out; Note 'go build' $out; throw 'go build of the app failed' }
          wsl.exe --shutdown
          $shots = Join-Path $env:RUNNER_TEMP 'wsl-shots'
          $start = Get-Date
          $said = & "$env:RUNNER_TEMP\Irie.exe" --snapshot $shots 2>&1 | Out-String
          $code = $LASTEXITCODE
          $took = [int]((Get-Date) - $start).TotalSeconds
          $said
          $log = Get-Content (Join-Path $env:LOCALAPPDATA 'irie\app.log') -Raw -ErrorAction SilentlyContinue
          $log
          Note "Irie.exe --snapshot exited $code after $took s" ($said + $log)
          $linux = Linux @'
          for f in ~/.local/state/irie/*.log; do echo "--- $f"; tail -n 60 "$f"; done
          echo '--- tmux'; tmux -L irie list-panes -a -F '#{session_name}:#{window_name} #{pane_dead} #{pane_current_command}'
          echo '--- processes'; ps -eo pid,etime,args | grep -v ' \[' | head -40
          '@ | Out-String
          $linux
          Note 'Linux after the app' $linux
          if ($code -ne 0) { throw "Irie.exe --snapshot exited $code" }
          $png = Join-Path $shots 'window.png'
          if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 20000) { throw 'window.png is missing or blank' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irie-for-windows-on-wsl
          path: ${{ runner.temp }}/wsl-shots
          if-no-files-found: ignore
