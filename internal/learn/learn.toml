# What Irie teaches with (docs/proposals/learning.md): the tips it adds under
# Claude Code's spinner, and the learning resources and glossary of the Help
# menu. Irie links to the resources and copies nothing of theirs. Each link
# was checked live when it was added; PROVENANCE.md lists them.

# Tips go to Claude Code's spinner under the label "Irie tip", one line each
# (at most 500 characters), each with an id Claude Code keeps its history by.

[[tip]]
id = "irie.keep-running"
text = "Your agents keep running when Irie's window closes; open it again and each is where you left it"

[[tip]]
id = "irie.red"
text = "A red card needs you: a question, a permission or a plan to approve"

[[tip]]
id = "irie.verify"
text = "A ✓ on a card means its turn is over and the work waits for you to check it"

[[tip]]
id = "irie.park"
text = "Park a session you have checked: it leaves the to-verify count and keeps running"

[[tip]]
id = "irie.undo"
text = "Irie's undo takes back a park, a close or a reopen, and a closed session comes back with its conversation"

[[tip]]
id = "irie.pause"
text = "Pause holds an agent at its next tool call; freeze stops everything it runs at once"

[[tip]]
id = "irie.promote"
text = "Promote a session to give it the machine first; the others run in the background until you stop"

[[tip]]
id = "irie.repo"
text = "Start a task with @ and a repo's name to run it in a worktree of its own, so agents never edit each other's files"

[[tip]]
id = "irie.haiku"
text = "Start a small task with +haiku: it costs a fortieth of Opus's price"

[[tip]]
id = "irie.local"
text = "Start a task with +local to run it on a model on this computer, with no tokens"

[[tip]]
id = "irie.tutor"
text = "Start a task with +explain to hear why the agent does what it does, or +teach to write the key parts yourself"

[[tip]]
id = "irie.hows"
text = "Ask how a session is going: type hows and its name in Irie's task bar"

[[tip]]
id = "irie.dog"
text = "A finished jot whose work has not landed says what is left on its card, and irie ctl dog lists them all"

[[tip]]
id = "irie.learn"
text = "Irie's Help menu has a glossary of the words agents use, and free courses on git, the terminal and Claude Code"

