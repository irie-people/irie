# The glossary: the words Irie and its agents use, in plain words.

[[term]]
term = "agent"
means = "A program that does a task for you with an AI model: it reads files, runs commands and writes code. Claude Code is one."

[[term]]
term = "branch"
means = "A line of commits that grows on its own, so work can go on without touching the main line until it is ready."

[[term]]
term = "commit"
means = "A saved step in a repo's history, with a message that says what changed."

[[term]]
term = "context"
means = "Everything a model can see at once: your task, the files it read and the conversation so far. When it fills up, the older part is summarised."

[[term]]
term = "diff"
means = "The lines a change adds and removes, marked + and −."

[[term]]
term = "freeze"
means = "Stop a session and everything it runs at once. Thaw carries it all on."

[[term]]
term = "helper"
means = "A subagent: a smaller agent that a session starts for one part of its task, such as a search. It shows under its session's card."

[[term]]
term = "Insight"
means = "A short note, in explain and teach modes, on why the agent made a choice."

[[term]]
term = "jot"
means = "A task typed into the task bar and left to run. Irie's jot dog checks that its work is finished and lands."

[[term]]
term = "land"
means = "Work has landed when it reaches the branch that counts, such as main, or the branch an install is made from."

[[term]]
term = "local model"
means = "A model that runs on your own computer. It costs no tokens, but takes memory while it runs."

[[term]]
term = "merge"
means = "Bring the commits of one branch into another."

[[term]]
term = "model"
means = "The AI an agent thinks with, such as Opus, Sonnet or Haiku. A bigger model does harder work and costs more."

[[term]]
term = "needs you"
means = "The session waits for you: a question, a permission or a plan to approve. Its card turns red."

[[term]]
term = "output style"
means = "How Claude Code talks to you. Irie's tutor mode uses its Explanatory and Learning styles."

[[term]]
term = "park"
means = "Move a session you have checked to the Parked group at the end of the list. It keeps running, and leaves the to-verify count."

[[term]]
term = "pause"
means = "Hold an agent at its next tool call, so it finishes the step it is on first. Resume carries it on."

[[term]]
term = "permission"
means = "An agent's question before a step, such as running a command or editing a file, that needs your yes."

[[term]]
term = "profile"
means = "A named way to run an agent: which program, which model, and how hard it thinks. +haiku and +local are profiles."

[[term]]
term = "promote"
means = "Put a session first and give it the machine first; the other sessions run in the background."

[[term]]
term = "prompt"
means = "What you type to an agent: a task, an answer or a note."

[[term]]
term = "repo"
means = "A folder whose history git keeps: every change, who made it and when. Short for repository."

[[term]]
term = "session"
means = "One agent at work on one task, with its own card in Irie's list and its own terminal."

[[term]]
term = "task"
means = "What you ask an agent to do, in plain words. Each task you type starts a session."

[[term]]
term = "terminal"
means = "A window where you type commands and programs answer in text. Each agent runs in one, which Irie can show."

[[term]]
term = "test"
means = "A small program that checks that code does what it should. Agents run tests to check their own work."

[[term]]
term = "to verify"
means = "The agent's turn is over and you have not checked its work yet. Its card shows ✓."

[[term]]
term = "TODO(human)"
means = "A mark the agent leaves in a file in teach mode, where you write the next piece of code yourself."

[[term]]
term = "token"
means = "The unit a model reads and writes in, a few letters long. Cloud models are paid for by the token."

[[term]]
term = "tool call"
means = "One step an agent takes: reading a file, running a command or editing code. Irie says each in plain words."

[[term]]
term = "tutor mode"
means = "How Claude Code sessions work with you: off; explain, where it tells you why; or teach, where it leaves parts for you to write."

[[term]]
term = "worktree"
means = "Another copy of a repo's files, on a branch of its own. Irie gives each @repo task its own, so agents never edit each other's files."
